<!DOCTYPE html>
<html>
<head>
    <title>REGISTRATION MENU TAB</title>
    <link rel = "stylesheet" href="/Amazing Charity Group/styles/registration-menu.css">
  </head>

<body>
  <h1>Welcome to Amazing Charity Group</h1>

<form id="detailsForm">
  <fieldset id="memberDetails">
    <legend>DETAILS</legend>
      <div class="data-input" id="dataInput">
        
            <label for="lastName">Last Name</label><br>
            <input class="js-fullname-input" type="text" id="lastName" required ><br>
            <label for="firstName">First Name</label><br>
            <input class="js-fullname-input" type="text"  id="firstName" required><br>
            <label for="nationality">Nationality</label><br>
            <input class="js-nationality-input" type="text" id="Nationality" required><br>
            <label for="Location">Location</label><br>
             <input class="js-location-input" type="text" id="Location" required><br>
            <label for="phoneNumber">Phone Number</label><br>
             <input class="js-phone-num-input" type="number" id="phoneNumber" required><br>
            <label for="idNumber">Identification Number</label><br>
            <input class="js-identification-number-input" type="number" id="idNumber" required ><br>
            <label for="dob">Date of Birth</label><br>
             <input class="js-dob-input" type="date" id="dob" required><br><br>
         
            <button type="button" value="Submit" id="submitButton"  class="submit-button js-submit-button">Submit</button>
            
         
        </div>
       </fieldset>
</form>

  <fieldset>
    <legend>ACTIVE MEMBER</legend>
    <div id="memberContainer" class="js-member-data-grid"></div>
    <button id="activeMemberButton" type="button" class="show-active-members js-show-active-members">View List</button>
      <div class="member-data js-member-data-grid"></div> 
  </fieldset>

<script src="/Amazing Charity Group/scripts/registration-menu.js"></script>


</body>

</html>
